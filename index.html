<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Ship Editor</title>
		<link rel="stylesheet" type="text/css" href="style.css">
		<link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
	</head>
	<body>
		<div id="items-list">
			<fieldset>
				<legend>Ship selection</legend>

				<select id="ship-select">
					<option value="-2" disabled selected>Choose ship</option>
					<option value="-1">New ship</option>
				</select>
			</fieldset>

			<fieldset>
				<legend>Ship structure</legend>

				<div id="ship-structure">

				</div>

				<hr />

				<select id="ship-structure-add-select">
					<option>rect</option>
					<option>poly</option>
					<option>path</option>
					<option>circle</option>
				</select>
				<input type="button" name="ship-structure-add" id="ship-structure-add" value="Add shape">
			</fieldset>

			<fieldset>
				<legend>Ship components</legend>

				<div id="ship-components">

				</div>

				<hr />

				<select id="ship-components-add-select">
					<option>cannon</option>
					<option>hangar</option>
					<option>shield</option>
					<option>sub_propulsion</option>
					<option>sup_propulsion</option>
				</select>
				<input type="button" name="ship-components-add" id="ship-components-add" value="Add component">
			</fieldset>

			<fieldset>
				<legend>Ship component type</legend>

				<div id="ship-components-type-rocketLauncher">
					<strong>Rocket Launchers:</strong><br/>
					<label for="rocketLauncher-none">None</label><input type="checkbox" name="rocketLauncher-none" id="rocketLauncher-none">
					<label for="rocketLauncher-explosive">Explosive</label><input type="checkbox" name="rocketLauncher-explosive" id="rocketLauncher-explosive">
					<label for="rocketLauncher-nuke">Nuclear</label><input type="checkbox" name="rocketLauncher-nuke" id="rocketLauncher-nuke">
					<label for="rocketLauncher-iem">IEM</label><input type="checkbox" name="rocketLauncher-iem" id="rocketLauncher-iem">
					<label for="rocketLauncher-antimatter">Antimatter</label><input type="checkbox" name="rocketLauncher-antimatter" id="rocketLauncher-antimatter">
				</div>

				<hr />

				<div id="ship-components-type-cannon">
					<strong>Cannon:</strong><br/>
					<label for="cannon-none">None</label><input type="checkbox" name="cannon-none" id="cannon-none">
					<label for="cannon-railgun">Railgun</label><input type="checkbox" name="cannon-railgun" id="cannon-railgun">
					<label for="cannon-laser">Laser</label><input type="checkbox" name="cannon-laser" id="cannon-laser">
					<label for="cannon-plasma">Plasma</label><input type="checkbox" name="cannon-plasma" id="cannon-plasma">
				</div>

				<hr />

				<div id="ship-components-type-shield">
					<strong>Defenses:</strong><br/>
					<label for="shield-none">None</label><input type="checkbox" name="shield-none" id="shield-none">
					<label for="shield-magnetic">Magnetic</label><input type="checkbox" name="shield-magnetic" id="shield-magnetic">
					<label for="shield-turret">Turret</label><input type="checkbox" name="shield-turret" id="shield-turret">
					<label for="shield-singularity">Singularity</label><input type="checkbox" name="shield-singularity" id="shield-singularity">
					<label for="shield-projector">Projector</label><input type="checkbox" name="shield-projector" id="shield-projector">
				</div>

				<hr />

				<div id="ship-components-type-hangar">
					<strong>Hangar:</strong><br/>
					<label for="hangar-none">None</label><input type="checkbox" name="hangar-none" id="hangar-none">
					<label for="hangar-hangarSimple">Simple</label><input type="checkbox" name="hangar-hangarSimple" id="hangar-hangarSimple">
					<label for="hangar-hangarDouble">Double</label><input type="checkbox" name="hangar-hangarDouble" id="hangar-hangarDouble">
				</div>

				<hr />

				<div id="ship-components-type-sub_propulsion">
					<strong>Sub propulsion:</strong><br/>
					<label for="sub_propulsion-none">None</label><input type="checkbox" name="sub_propulsion-none" id="sub_propulsion-none">
					<label for="sub_propulsion-ion">Ion</label><input type="checkbox" name="sub_propulsion-ion" id="sub_propulsion-ion">
					<label for="sub_propulsion-pplasma">Plasma</label><input type="checkbox" name="sub_propulsion-pplasma" id="sub_propulsion-pplasma">
					<label for="sub_propulsion-vsolaire">Solar sail</label><input type="checkbox" name="sub_propulsion-vsolaire" id="sub_propulsion-vsolaire">
				</div>

				<hr />

				<div id="ship-components-type-sup_propulsion">
					<strong>Sup propulsion:</strong><br/>
					<label for="sup_propulsion-none">None</label><input type="checkbox" name="sup_propulsion-none" id="sup_propulsion-none">
					<label for="sup_propulsion-vsl">VSL</label><input type="checkbox" name="sup_propulsion-vsl" id="sup_propulsion-vsl">
					<label for="sup_propulsion-wd">WD</label><input type="checkbox" name="sup_propulsion-wd" id="sup_propulsion-wd">
					<label for="sup_propulsion-hyperespace">Hyperespace</label><input type="checkbox" name="sup_propulsion-hyperespace" id="sup_propulsion-hyperespace">
				</div>
			</fieldset>

			<fieldset>
				<legend>Validation</legend>

				<input type="button" id="ship-save" value="Save Ship">
			</fieldset>
		</div>
		<div id="ship-preview">
			<svg id="fleet-type-create-schematic" viewBox="0 0 800 450" preserveAspectRatio="none"></svg>
			<div id="fleet-type-create-selects"></div>

			<div id="fleet-type-create-stat">
				<div id="fleet-type-create-stat-subspeed">SHIP_SUBSPEED : <span id="fleet-type-create-stat-subspeed-val"></span><br /></div>
				<div id="fleet-type-create-stat-supspeed">SHIP_SUPSPEED : <span id="fleet-type-create-stat-supspeed-val"></span><br /></div>
				<div id="fleet-type-create-stat-miss">SHIP_MISS_CHANCE : <span id="fleet-type-create-stat-miss-val"></span><br /></div>
				<div id="fleet-type-create-stat-fcap">SHIP_FCAP : <span id="fleet-type-create-stat-fcap-val"></span><br /></div>
				<div id="fleet-type-create-stat-fweight">SHIP_FWEIGHT : <span id="fleet-type-create-stat-fweight-val"></span><br /></div>
				<div id="fleet-type-create-stat-note">FLEET_BUILD_NOTE : <span id="fleet-type-create-stat-note-val"></span><br /></div>
			</div>

			<span id="fleet-type-create-submit"></span>
		</div>

		<script type="text/javascript" src="https://cdn.galactae.eu/game/js/calcConstants.js"></script>
		<script type="text/javascript" src="https://cdn.galactae.eu/game/js/_shared/Units.js"></script>
		<script type="text/javascript">function ready() { /* Do nothing here */ }</script>
		<script type="text/javascript" src="https://cdn.galactae.eu/game/js/ui.js"></script>
		<script type="text/javascript" src="https://cdn.galactae.eu/game/js/units.js"></script>
		<script type="text/javascript" src="./fleetTranslate.js"></script>
		<script type="text/javascript">
			const remote = require('electron').remote;
			let shipData = {};
			let selectedShip = '';

			/**
			 * Mock data
			 */
			class research {
				static isSearched() {
					return true;
				}
			}

			const userData = {};

			function generateDeleteButton(parent, onClick) {
				const deleteButton = document.createElement('p');
				deleteButton.innerText = 'X';
				deleteButton.addEventListener('click', onClick);
				deleteButton.classList.add('delete-button');
				parent.appendChild(deleteButton);
			}

			function updateComponentLabels() {
				const componentTypes = {};

				for(const componentId in shipData.svg) {
					const component = shipData.svg[componentId];
					if(component[0] === 'struct') { 
						continue;
					}

					let type = component[0];
					if(type.endsWith('propulsion')) {
						type = 'prop';
					}

					if(!componentTypes[type]) {
						componentTypes[type] = 1;
					}

					shipData.svg[componentId][6] = type + '_' + componentTypes[type];

					componentTypes[type]++;
				}
			}

			function createShipSelect(selectedType) {
				const select = document.createElement('select');

				for(const type of ['cannon', 'hangar', 'shield', 'sub_propulsion', 'sup_propulsion']) {
					const option = document.createElement('option');
					option.innerText = type;
					option.selected = (type === selectedType);

					select.appendChild(option);
				}

				return select;
			}

			/**
			 * Do stuff
			 */
			function redrawShipData() {
				console.log(shipData);

				// List structure parts
				const shipStructure = document.getElementById('ship-structure');
				while(shipStructure.firstChild) {
					shipStructure.removeChild(shipStructure.firstChild);
				}

				for(const elementId in shipData.svg) {
					const element = shipData.svg[elementId];
					if(element[0] !== 'struct') {
						continue;
					}

					const listDiv = document.createElement('div');
					listDiv.classList.add('form-group');

					const shapeType = document.createElement('span');
					shapeType.classList.add('form-label');
					shapeType.innerText = element[1];
					listDiv.appendChild(shapeType);

					let length = element.length + 1;
					if(element[1] === 'rect') {
						length = 6;
					} else if(element[1] === 'circle') {
						length = 5;
					}

					for(let i=2; i<length; i++) {
						const input = document.createElement('input');
						input.setAttribute('type', 'text');
						input.value = element[i] || '';
						input.addEventListener('change', (e) => {
							if(typeof shipData.svg[elementId][i] === 'undefined') {
								shipData.svg[elementId].push(e.target.value);
							} else {
								shipData.svg[elementId][i] = e.target.value;
							}

							if(e.target.value === '') {
								shipData.svg[elementId].splice(i, 1);
							}

							redrawShipData();
						});

						listDiv.appendChild(input);
					}

					// @TODO: change order

					generateDeleteButton(listDiv, () => {
						shipData.svg.splice(elementId, 1);
						redrawShipData();
					});

					shipStructure.appendChild(listDiv);
				}

				// List components
				const shipComponents = document.getElementById('ship-components');
				while(shipComponents.firstChild) {
					shipComponents.removeChild(shipComponents.firstChild);
				}

				for(const elementId in shipData.svg) {
					const element = shipData.svg[elementId];
					if(element[0] === 'struct') {
						continue;
					}

					const listDiv = document.createElement('div');
					listDiv.classList.add('form-group');

					const shapeType = document.createElement('span');
					shapeType.classList.add('form-label');
					shapeType.innerText = element[6];
					listDiv.appendChild(shapeType);

					const componentSelect = createShipSelect(element[0]);
					componentSelect.addEventListener('change', (e) => {
						shipData.svg[elementId][0] = e.target.value;
						updateComponentLabels();
						redrawShipData();
					});
					listDiv.appendChild(componentSelect);

					for(let i=2; i<4; i++) {
						const input = document.createElement('input');
						input.setAttribute('type', 'number');
						input.value = element[i];
						input.addEventListener('change', (e) => {
							shipData.svg[elementId][i] = e.target.value;
							units.drawShipShape(shipData.svg, shipData.content);
						});

						listDiv.appendChild(input);
					}

					generateDeleteButton(listDiv, () => {
						shipData.svg.splice(elementId, 1);
						updateComponentLabels();
						redrawShipData();
					});

					shipComponents.appendChild(listDiv);
				}

				/**
				 * Component types
				 */
				for(const elt of document.querySelectorAll('input[type=checkbox]')) {
					elt.checked = false;
				}

				for(const partType in shipData.content) {
					for(const tech of shipData.content[partType]) {
						document.getElementById(partType + '-' + tech).checked = true;
					}
				}

				// Draw SVG
				units.drawShipShape(shipData.svg, shipData.content);
			}

			window.addEventListener('load', () => {
				const shipList = remote.getGlobal('getShipList')();
				const shipSelect = document.getElementById('ship-select');
				for(const ship of shipList) {
					const option = document.createElement('option');
					option.innerText = ship;

					shipSelect.appendChild(option);
				}

				shipSelect.addEventListener('change', (e) => {
					if(e.target.value === '-1') {
						shipData = {
							svg: [],
							content: {},
						};
						selectedShip = ''; // @TODO: input
						redrawShipData();
					} else {
						selectedShip = e.target.value;
						shipData = JSON.parse(JSON.stringify(remote.getGlobal('getShipData')(e.target.value)));
						redrawShipData();
					}
				});

				document.getElementById('ship-save').addEventListener('click', () => {
					if(selectedShip !== '') {
						remote.getGlobal('saveShipData')(selectedShip, shipData);
					}
				});

				for(const elt of document.querySelectorAll('input[type=checkbox]')) {
					elt.addEventListener('change', (e) => {
						const parts = elt.id.split('-');
						if(e.target.checked) {
							if(!shipData.content[parts[0]]) {
								shipData.content[parts[0]] = [];
							}

							if(!shipData.content[parts[0]].includes(parts[1])) {
								shipData.content[parts[0]].push(parts[1]);
							}
						} else {
							if(shipData.content[parts[0]]) {
								shipData.content[parts[0]].splice(
									shipData.content[parts[0]].indexOf(parts[1]),
									1
								);

								if(shipData.content[parts[0]].length === 0) {
									delete shipData.content[parts[0]];
								}
							}
						}

						redrawShipData();
					});
				}

				document.getElementById('ship-structure-add').addEventListener('click', (e) => {
					shipData.svg.push([
						'struct',
						document.getElementById('ship-structure-add-select').value,
						0,
						0,
						0,
					]);

					redrawShipData();
				});

				document.getElementById('ship-components-add').addEventListener('click', (e) => {
					shipData.svg.push([
						document.getElementById('ship-components-add-select').value,
						'rect',
						0,
						0,
						50,
						50,
					]);

					updateComponentLabels();
					redrawShipData();
				});
			});
		</script>
	</body>
</html>
